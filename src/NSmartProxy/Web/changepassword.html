<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>NSmartProxy · 修改密码</title>
    <link href="bootstrap.min.css" rel="stylesheet">
    <link href="signin.css" rel="stylesheet">
</head>
<body class="text-center">
    <form class="form-signin" method="post" action="ChangePassword">
        <h1 class="h3 mb-3 font-weight-normal">修改密码</h1>
        <label for="oldPwd" class="sr-only">原密码</label>
        <input type="password" id="oldPwd" name="oldPwd" class="form-control" placeholder="原密码" required>
        <label for="newPwd" class="sr-only">新密码</label>
        <input type="password" id="newPwd" name="newPwd" class="form-control" placeholder="新密码（至少 12 位）" required minlength="12">
        <button class="btn btn-lg btn-primary btn-block" type="submit">保存</button>
    </form>
</body>
</html>
